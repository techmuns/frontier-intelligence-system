<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier — Technology Market Intelligence</title>

    <!-- REQUIRED: classic script, in <head>, before the app module.
         Defines window.MunshotDashboardSDK. Do NOT add type="module",
         async, or defer — load order matters. -->
    <script src="https://munshot.s3.ap-south-1.amazonaws.com/SDK+script/munshot-dashboard-sdk.v1.0.0.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Paints the correct surface before React mounts, so a dark-mode reader
         never gets a white flash on load. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("frontier.theme");
          var mode = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", mode);
          document.documentElement.style.colorScheme = mode;
          document.documentElement.style.background = mode === "dark" ? "#0f172a" : "#f8fafc";
        } catch (e) {
          /* Restricted iframe — the app sets this again on mount. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
